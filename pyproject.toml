[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork-data"
version = "0.1.0"
description = "Source-grounded training data and Harbor eval tasks with RLM generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rlms==0.1.3", "python-dotenv>=1.0", "openai>=1.0"]

[project.optional-dependencies]
harbor = ["harbor==0.3.0"]

[project.scripts]
groundwork = "groundwork.cli:main"

[tool.setuptools.packages.find]
include = ["groundwork*"]
